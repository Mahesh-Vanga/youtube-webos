<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>YouTube Extended Home</title>
    <style>
      html {
        background: #10131b;
        color: #f5f5f7;
        font: 24px sans-serif;
      }
      body {
        margin: 12vh 12vw;
      }
      h1 {
        font-size: 48px;
      }
      button {
        font: inherit;
        color: inherit;
        background: #30384b;
        padding: 18px 30px;
        border: 2px solid #a6bfdc;
        border-radius: 14px;
      }
      button:focus {
        outline: 4px solid white;
      }
      #status {
        line-height: 1.6;
        max-width: 1100px;
      }
    </style>
    <script defer src="index.js"></script>
  </head>
  <body>
    <h1>YouTube Extended</h1>
    <p id="status" role="status">Opening your installed player…</p>
    <button id="open">Open YouTube Extended</button>
    <p>
      This Home shortcut opens the existing player. Install YouTube Extended
      from Homebrew first.
    </p>
  </body>
</html>
